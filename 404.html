<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Morris Export Services</title>
  <script>
    // GitHub Pages SPA redirect trick (Hostname-Aware)
    // Avoids recursive redirect loops and parameter nesting on custom domains or local hosting.
    (function() {
      var l = window.location;
      var hostname = l.hostname;
      var base = '';
      
      if (hostname.endsWith('github.io')) {
        // github.io project pages have the repo name as the first directory segment
        var parts = l.pathname.split('/');
        if (parts.length > 1 && parts[1]) {
          base = '/' + parts[1];
        } else {
          base = '/morris-export-';
        }
      }
      
      // Calculate relative path from base
      var path = l.pathname;
      if (base && path.indexOf(base) === 0) {
        path = path.slice(base.length);
      }
      
      // Build redirect URL
      var redirect = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        base + '/?p=' + encodeURIComponent(path) +
        (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') +
        l.hash;
        
      l.replace(redirect);
    })();
  </script>
</head>
<body></body>
</html>
